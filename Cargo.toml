# Auto-generated workspace root. Prefer editing per-crate Cargo.toml files.

[workspace]
resolver = "2"
members = [
    "crates/causal-memory",
    "crates/causal-memory-cli",
    "crates/causal-memory-py",
    "benches/common",
]
# The py crate is a cdylib for maturin wheels; plain release profile links
# -lpython3.9, which the macOS system Python does not ship. Build/test it
# through maturin (see crates/causal-memory-py/pyproject.toml); unqualified
# `cargo build --release` / `cargo test` cover the Rust crates only
# (`cargo test --workspace` still includes it — dev linking works there).
default-members = [
    "crates/causal-memory",
    "crates/causal-memory-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JingxuanC/causal-memory"
version = "0.9.2"

[workspace.dependencies]
anyhow = "1"
rmcp = { version = "2.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
# native-tls-vendored: build OpenSSL from source so manylinux/Windows wheels
# don't depend on a system OpenSSL (keeps native-tls semantics — see the
# recorded zhipu/reqwest TLS lesson; do not switch to rustls casually).
reqwest = { version = "0.12", features = ["json", "native-tls-vendored"] }
futures = "0.3"
causal-memory = { path = "crates/causal-memory" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# ─── Workspace lints ───────────────────────────────────────────────────
# Per rust-skills lint-workspace-lints: centralized enforcement so every
# crate shares one quality bar. correctness/suspicious → deny (hard bugs),
# style/complexity/perf → warn. unwrap_used → deny outside tests.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Correctness = outright bugs. Always deny.
correctness = { level = "deny", priority = -1 }
# Suspicious = likely bugs. Deny.
suspicious = { level = "deny", priority = -1 }
# Style/complexity/perf = quality. Warn, fixable.
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Selective pedantic: high-signal lints only.
redundant_clone = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
# unwrap/expect → panic in production. Warn (not deny) so the baseline
# compiles; new code should avoid them and the count should trend down.
# Tests override this per-target via #[allow] (tests use unwrap freely).
unwrap_used = "warn"
expect_used = "warn"
