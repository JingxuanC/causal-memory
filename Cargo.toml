# Auto-generated workspace root. Prefer editing per-crate Cargo.toml files.

[workspace]
resolver = "2"
members = [
    "crates/causal-memory",
    "crates/causal-memory-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JingxuanC/causal-memory"
version = "0.8.0"

[workspace.dependencies]
anyhow = "1"
rmcp = { version = "2.1", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
causal-memory = { path = "crates/causal-memory" }

[profile.release]
lto = true
codegen-units = 1
strip = true
