[package]
name = "causal-memory"
description = "Causal Memory Layer for AI Agents — records and retrieves decision→outcome causal relationships"
keywords = ["ai", "agent", "memory", "mcp", "causal"]
categories = ["data-structures", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
chrono.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["time"] }

# Local embedding via ONNX (optional). Enable with --features local-embed.
# Uses fastembed-rs (BAAI/bge-small-en-v1.5, 384 dims, ~130MB, downloads on first use).
# On macOS, build.rs links CoreML framework (required by ort-sys).
fastembed = { version = "5", optional = true }

[features]
default = []
local-embed = ["dep:fastembed"]

[lib]
name = "causal_memory"
path = "src/lib.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
