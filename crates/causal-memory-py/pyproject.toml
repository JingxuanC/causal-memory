[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "causal-memory"
dynamic = ["version"]
description = "An agent memory system with a causal core — facts, temporal state, and decision→outcome causal edges on one SQLite store"
# pip-user-facing quickstart (the repo root README leads with cargo builds,
# which confuses people who just ran `pip install`).
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["ai", "agent", "memory", "mcp", "causal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/JingxuanC/causal-memory"

[tool.maturin]
# The Rust crate lives beside this pyproject.toml; the built module is the
# top-level `causal_memory` extension (no pure-Python package wrapper).
# extension-module is enabled here (never in Cargo.toml's default features)
# so plain `cargo build/test` keeps linking libpython.
module-name = "causal_memory"
features = ["extension-module"]
