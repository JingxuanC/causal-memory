[package]
name = "causal-memory-cli"
description = "CLI and MCP server binary for causal-memory"
keywords = ["ai", "agent", "memory", "mcp", "causal"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "causal_memory_cli"
path = "src/lib.rs"

[[bin]]
name = "causal-memory"
path = "src/main.rs"

[[bin]]
name = "causal-memory-bench"
path = "../../benches/bench_retrieval.rs"

[[bin]]
name = "causal-memory-locomo"
path = "../../benches/locomo/main.rs"

[[bin]]
name = "causal-memory-longmemeval"
path = "../../benches/longmemeval/main.rs"

[[bin]]
name = "causal-memory-memora"
path = "../../benches/memora/main.rs"

[[bin]]
name = "causal-memory-bench-memory"
path = "../../benches/memory/main.rs"

[[bin]]
name = "causal-memory-amc"
path = "src/amc.rs"

[features]
# Local ONNX embedding (fastembed, bge-small-en-v1.5) for the AMC server —
# pass-through of the library's local-embed feature. Build with:
#   cargo build --release --bin causal-memory-amc --features local-embed
local-embed = ["causal-memory/local-embed"]

[dependencies]
causal-memory.workspace = true
bench-common = { path = "../../benches/common" }
rmcp.workspace = true
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
reqwest.workspace = true
futures.workspace = true

[target.'cfg(unix)'.dependencies]
# Restore SIGPIPE default in run() so piping into `head` dies quietly
# instead of panicking on println! (Rust ignores SIGPIPE by default).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "2.1", features = ["client", "transport-child-process"] }

[lints]
workspace = true

[[bin]]
name = "causal-memory-causal-eval"
path = "../../benches/causal_eval/main.rs"

[[bin]]
name = "causal-memory-ablation"
path = "../../benches/ablation/main.rs"
