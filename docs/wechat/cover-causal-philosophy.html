<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1128px; height: 480px;
    background: #0b1220;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* subtle grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,150,200,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,150,200,0.06) 1px, transparent 1px);
    background-size: 47px 48px;
  }
  .glow {
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(74,111,165,0.28) 0%, rgba(74,111,165,0) 65%);
    top: -260px; left: -180px;
  }
  .glow2 {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(178,59,59,0.16) 0%, rgba(178,59,59,0) 65%);
    bottom: -320px; right: -140px;
  }
  .content {
    position: absolute; inset: 0;
    padding: 64px 72px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    color: #7f96b8;
    font-size: 21px;
    letter-spacing: 6px;
    margin-bottom: 26px;
    display: flex; align-items: center; gap: 16px;
  }
  .kicker::before {
    content: "";
    display: inline-block;
    width: 42px; height: 2px;
    background: #4a6fa5;
  }
  h1 {
    color: #eef3fa;
    font-size: 92px;
    font-weight: 800;
    letter-spacing: 10px;
    line-height: 1.1;
  }
  h1 .accent { color: #6f9bd8; }
  .sub {
    margin-top: 26px;
    color: #9fb2cc;
    font-size: 27px;
    letter-spacing: 3px;
  }
  /* causal ladder */
  .ladder {
    position: absolute;
    right: 64px; bottom: 52px;
    display: flex; align-items: flex-end; gap: 14px;
  }
  .rung {
    width: 128px;
    border-radius: 10px 10px 0 0;
    display: flex; flex-direction: column; justify-content: flex-start;
    padding: 14px 0 0;
    text-align: center;
    color: #dbe6f5;
    border: 1px solid rgba(140,170,215,0.35);
    border-bottom: none;
    background: linear-gradient(180deg, rgba(74,111,165,0.35), rgba(74,111,165,0.08));
  }
  .rung .num { font-size: 15px; color: #8fa9cd; letter-spacing: 2px; }
  .rung .name { font-size: 24px; font-weight: 700; margin-top: 6px; letter-spacing: 4px; }
  .rung .en { font-size: 12px; color: #6d84a5; margin-top: 4px; letter-spacing: 1px; }
  .r1 { height: 92px; }
  .r2 { height: 152px; background: linear-gradient(180deg, rgba(90,130,190,0.45), rgba(90,130,190,0.10)); }
  .r3 { height: 212px; background: linear-gradient(180deg, rgba(111,155,216,0.60), rgba(111,155,216,0.14)); border-color: rgba(160,195,235,0.6); }
  .r3 .name { color: #ffffff; }
  .arrow {
    position: absolute;
    right: 72px; bottom: 292px;
    color: #6f9bd8;
    font-size: 19px;
    letter-spacing: 3px;
    opacity: 0.9;
  }
  .edge-deco {
    position: absolute;
    left: 72px; bottom: 56px;
    color: #44587a;
    font-size: 15px;
    font-family: Menlo, monospace;
    letter-spacing: 1px;
  }
  .edge-deco .c { color: #5fb878; }
  .edge-deco .p { color: #d4655f; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="content">
    <div class="kicker">CAUSAL MEMORY · AGENT 记忆系统</div>
    <h1>因果<span class="accent">记忆</span></h1>
    <div class="sub">从哲学因果论说起 · 一个能跑的工程实现</div>
  </div>
  <div class="arrow">因果梯级 Ladder of Causation ⟶</div>
  <div class="ladder">
    <div class="rung r1"><div class="num">Rung 1</div><div class="name">关联</div><div class="en">seeing</div></div>
    <div class="rung r2"><div class="num">Rung 2</div><div class="name">干预</div><div class="en">doing</div></div>
    <div class="rung r3"><div class="num">Rung 3</div><div class="name">反事实</div><div class="en">imagining</div></div>
  </div>
  <div class="edge-deco">decision <span class="c">—caused→</span> outcome &nbsp;·&nbsp; decision <span class="p">—prevented→</span> failure</div>
</body>
</html>
