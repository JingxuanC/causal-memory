name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

      # NOTE: no `-D warnings` here on purpose. [workspace.lints.clippy] in
      # Cargo.toml sets style/complexity/perf and unwrap_used/expect_used to
      # "warn" explicitly so the baseline compiles (see the comment there).
      # Passing `-D warnings` contradicts that and turned every one of those
      # warnings into a hard failure — the count was 1476 unwrap/expect plus
      # assorted style lints, so no release could ever get a green CI.
      # Correctness and suspicious stay `deny` via workspace lints, so real
      # bugs still break the build. Clippy output remains visible in the log.
      - name: Clippy
        run: cargo clippy --workspace
